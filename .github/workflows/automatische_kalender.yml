name: Rollende Kalender Update

on:
  schedule:
    - cron: '0 4 * * *'  # Draait elke dag om 04:00 UTC
  workflow_dispatch:     # Zodat je hem ook handmatig kunt testen

jobs:
  update-kalender:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Haal code op
      uses: actions/checkout@v4

    - name: Installeer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installeer benodigde bibliotheken
      run: pip install ephem python-dateutil

    - name: Bereken en update rollende evenementen
      run: python automatische_kalender.py

    - name: Sla database op in repository
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add evenementen.db
        git commit -m "Automatische kalender: Datums doorgeschoven" || echo "Geen wijzigingen"
        git push
