name: Database Opschonen (Verwijder www)

on:
  workflow_dispatch:

jobs:
  opschonen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Haal code op
      uses: actions/checkout@v4

    - name: Installeer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Draai opschoon script
      run: python opschonen_db.py

    - name: Sla aangepaste database op in repository
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add evenementen.db
        git commit -m "Database opgeschoond: www verwijderd uit URL's" || echo "Geen wijzigingen"
        git push
