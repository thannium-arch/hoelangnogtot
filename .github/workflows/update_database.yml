name: Dagelijkse Database Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run IGDB API script
      env:
        IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
        IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      run: python api_igdb.py

    - name: Run TMDB API script
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: python api_tmdb.py

    - name: Run Ticketmaster API script
      env:
        TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      run: python api_ticketmaster.py

    - name: Run Feestdagen script
      run: python update_feestdagen.py

    - name: Exporteer naar JSON
      run: python export_json.py

    - name: Voeg ontbrekende SEO tags toe
      run: python auto_seo.py

    - name: Genereer dynamische Sitemap
      run: python generate_sitemap.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'Automated Bot'
        git config --global user.email 'bot@hoelangnogtot.nl'
        git add -A
        git commit -m "Automatische database update en JSON export" || exit 0
        git push
